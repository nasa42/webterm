[package]
name = "webterm-agent"
description = "Lightweight agent component for Webterm that enables secure browser-based terminal access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { version = "4.5.28", features = ["derive", "env"] }
daemonize = "0.5.0"
flatbuffers = "25.1.24"
futures = "0.3.31"
gethostname = "1.0.0"
pty-process = { version = "0.4.0", features = ["async"] }
reqwest = "0.12.12"
semver = "1.0.25"
tokio = "1.43.0"
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
webterm-core = { path = "../core", version = "0.2.5" }

[lints.clippy]
new_without_default = "allow"
# Suppress this fow now:
#
# error: the `Err`-variant returned from this function is very large
#  --> agent/src/models/frontend.rs:76:10
#   |
#76 |     ) -> Result<bool, AgentError> {
#   |          ^^^^^^^^^^^^^^^^^^^^^^^^
#   |
#  ::: agent/src/models/agent_error.rs:16:5
#   |
#16 |     SocketError(tungstenite::Error),
#   |     ------------------------------- the largest variant contains at least 136 bytes
result_large_err = "allow"
